openapi: 3.0.3
info:
  title: 家庭健康管理 API
  version: 0.2.0
  description: |
    接口契约的唯一事实来源。Go 服务端接口（oapi-codegen）和前端 TS 类型（openapi-typescript）
    都由本文件生成，修改后执行 `make gen`。

    约定（详见 docs/tech-plan.md「API 设计」）：
    - 业务接口统一前缀 `/api`，JSON 字段用 camelCase。
    - 时间用 ISO 8601 带时区偏移（2026-09-24T21:30:00+08:00），纯日期用 2026-09-24；按天统计以 Asia/Shanghai 为准。
    - 记录和附件用 `PUT /{id}` 幂等创建，ID 由前端生成（UUIDv7）：首次创建返回 201，重复提交返回 200 和已有资源。
    - PATCH 只改请求里出现的字段；可清空的字段传 null 表示清空。
    - 列表用游标分页，默认每页 50 条。
    - 鉴权用 Cookie `hl_sid`（登录接口下发，Path 为部署前缀）；所有写请求校验 Origin 头。
    - 部署在路径前缀下（生产为 `/health`，与 crab 共用域名）：下文路径都相对于该前缀，
      如 `/api/me` 实际为 `/health/api/me`；响应里返回的 URL（附件、头像）已包含前缀，可直接使用。
    - 错误统一返回 Error 结构。
servers:
  - url: /
security:
  - cookieAuth: []

tags:
  - name: system
  - name: auth
  - name: members
  - name: episodes
  - name: records
  - name: attachments
  - name: reports

paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: 健康检查（数据库、Gotenberg 连通性），供外部拨测使用
      security: []
      responses:
        "200":
          description: 全部依赖正常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 至少一个依赖异常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 用户名密码登录，成功后下发 Cookie hl_sid（30 天，活跃时滑动续期）
      description: 同一 IP 连续失败 5 次锁定 15 分钟，锁定期间返回 429。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 注销当前会话；all=true 注销该账号的全部会话
      parameters:
        - name: all
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: 已注销 }
        default: { $ref: "#/components/responses/Error" }

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前账号和家庭
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /api/home:
    get:
      tags: [members]
      operationId: getHome
      summary: 首页与家庭总览的聚合数据
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        default: { $ref: "#/components/responses/Error" }

  /api/members:
    get:
      tags: [members]
      operationId: listMembers
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 按 sortOrder 排序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [members]
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }

  /api/members/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [members]
      operationId: getMember
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [members]
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [members]
      operationId: deleteMember
      summary: 删除成员及其全部病程、记录和附件（不可恢复，需带 confirm=true）
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/members/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [members]
      operationId: archiveMember
      summary: 归档：数据保留，不再出现在快速切换中
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }

  /api/members/{id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [members]
      operationId: unarchiveMember
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }

  /api/members/{id}/by-disease:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [members]
      operationId: getMemberByDisease
      summary: 成员主页“按病种”视图：同一病种的全部病程及汇总
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [1y, 3y, all]
            default: 1y
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ByDisease" }
        default: { $ref: "#/components/responses/Error" }

  /api/members/{id}/calendar:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Month"
    get:
      tags: [members]
      operationId: getMemberCalendar
      summary: 成员一个月内每天各类型的记录数（跨病程）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        default: { $ref: "#/components/responses/Error" }

  /api/disease-tags:
    get:
      tags: [episodes]
      operationId: listDiseaseTags
      summary: 病种标签：系统预置 + 本家庭自定义
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiseaseTag" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [episodes]
      operationId: createDiseaseTag
      summary: 新增自定义病种；同名已存在时返回已有标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiseaseTagCreate" }
      responses:
        "200":
          description: 已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiseaseTag" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiseaseTag" }
        default: { $ref: "#/components/responses/Error" }

  /api/episodes:
    get:
      tags: [episodes]
      operationId: listEpisodes
      summary: 病程列表，按最近一条记录时间倒序
      parameters:
        - name: memberId
          in: query
          schema: { type: string, format: uuid }
        - name: open
          in: query
          description: true 只返回未结束的（进行中、治疗中、稳定期）
          schema: { type: boolean }
        - name: diseaseTagId
          in: query
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/EpisodeKind" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Episode" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [episodes]
      operationId: createEpisode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        default: { $ref: "#/components/responses/Error" }

  /api/episodes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [episodes]
      operationId: getEpisode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [episodes]
      operationId: updateEpisode
      summary: 编辑病程与切换状态；短期可转长期（进行中→治疗中，已康复→稳定期）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpisodePatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [episodes]
      operationId: deleteEpisode
      summary: 删除病程，其中的记录退回待整理
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/episodes/{id}/calendar:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Month"
    get:
      tags: [episodes]
      operationId: getEpisodeCalendar
      summary: 病程一个月内每天各类型的记录数和最高症状程度
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        default: { $ref: "#/components/responses/Error" }

  /api/episodes/{id}/trend:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [episodes]
      operationId: getEpisodeTrend
      summary: 体温和症状程度的时间序列
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trend" }
        default: { $ref: "#/components/responses/Error" }

  /api/records:
    get:
      tags: [records]
      operationId: listRecords
      summary: 统一的记录查询，覆盖时间线、待整理、按类型筛选和搜索；按发生时间倒序
      parameters:
        - name: memberId
          in: query
          schema: { type: string, format: uuid }
        - name: episodeId
          in: query
          schema: { type: string, format: uuid }
        - name: inbox
          in: query
          description: true 只返回未归入病程的记录
          schema: { type: boolean }
        - name: type
          in: query
          description: 可多选，如 type=visit&type=medication
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/RecordType" }
        - name: flare
          in: query
          description: true 只返回发作记录
          schema: { type: boolean }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: 搜索文字内容、语音补充文字、药名、医院名称
          schema: { type: string, maxLength: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordPage" }
        default: { $ref: "#/components/responses/Error" }

  /api/records/assign:
    post:
      tags: [records]
      operationId: assignRecords
      summary: 批量归入病程；episodeId 为 null 表示移回待整理；可带 newEpisode 同时新建
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/records/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [records]
      operationId: getRecord
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [records]
      operationId: putRecord
      summary: 创建记录（幂等）。ID 已存在时直接返回已有记录，不做修改
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordCreate" }
      responses:
        "200":
          description: 已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [records]
      operationId: updateRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [records]
      operationId: deleteRecord
      summary: 删除记录及其附件
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/medications/last:
    get:
      tags: [records]
      operationId: getLastMedication
      summary: 同一成员同一种药上次的服用时间，用于“上次服用”提示
      parameters:
        - name: memberId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: medName
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LastMedication" }
        default: { $ref: "#/components/responses/Error" }

  /api/attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [attachments]
      operationId: uploadAttachment
      summary: 上传附件（幂等）。照片和头像须为 JPEG；语音上传后异步转码
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AttachmentUpload" }
      responses:
        "200":
          description: 已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [attachments]
      operationId: updateAttachment
      summary: 修改语音补充文字或顺序
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/attachments/{id}/file:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [attachments]
      operationId: getAttachmentFile
      summary: 读取附件文件，支持 Range（语音可拖动）
      description: |
        登录态或打印令牌（token）二选一。语音默认返回转码后的 m4a，未转码完成时返回原始文件。
      security: []
      parameters:
        - name: variant
          in: query
          schema:
            type: string
            enum: [default, thumb, original]
            default: default
        - name: token
          in: query
          description: 打印令牌，供 Gotenberg 渲染报告时取图
          schema: { type: string }
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: 部分内容（Range）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/attachments/{id}/reprocess:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [attachments]
      operationId: reprocessAttachment
      summary: 转码失败的语音重新处理
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        default: { $ref: "#/components/responses/Error" }

  /api/exports:
    post:
      tags: [reports]
      operationId: createExport
      summary: 生成 PDF 报告，同步返回文件
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200":
          description: PDF 文件
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/print-data:
    get:
      tags: [reports]
      operationId: getPrintData
      summary: 打印页取数
      description: |
        Gotenberg 渲染时带一次性打印令牌（token）；导出页预览和浏览器打印凭登录态，并用 type/id/from/to/photos 指定范围。
      security: []
      parameters:
        - name: token
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/ReportType" }
        - name: id
          in: query
          description: 病程报告为病程 ID，成员健康档案为成员 ID
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: photos
          in: query
          schema: { $ref: "#/components/schemas/PhotoOption" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintData" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hl_sid

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Month:
      name: month
      in: query
      required: true
      description: 年月，如 2026-09
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'

  responses:
    Error:
      description: 错误（400/401/403/404/409/413/422/429/500）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          description: 各依赖的检查结果，值为 ok 或错误说明
          additionalProperties: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 机器可读的错误码，如 validation_failed、not_found、unauthorized
              example: validation_failed
            message:
              type: string
              description: 可直接展示给用户的中文说明
              example: 体温需在 34.0 到 43.0 之间
            fields:
              type: object
              description: 字段级错误，键为字段名
              additionalProperties: { type: string }
              example: { temperature: out_of_range }

    # ---------- 枚举 ----------
    MemberRelation:
      type: string
      enum: [self, spouse, child, parent, grandparent, other]
    Gender:
      type: string
      enum: [male, female]
    BloodType:
      type: string
      enum: [A, B, AB, O, unknown]
    EpisodeKind:
      type: string
      description: short 短期病程，long 长期病程
      enum: [short, long]
    EpisodeStatus:
      type: string
