# Production: one server, four containers; only Caddy is exposed.
# Run from the repository root: docker compose -f deploy/docker-compose.yml --env-file .env up -d

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

  app:
    image: ${APP_IMAGE:-healthlog:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://healthlog:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/healthlog?sslmode=disable
      STORAGE_DIR: /data/storage
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PRINT_TOKEN_SECRET: ${PRINT_TOKEN_SECRET:?set PRINT_TOKEN_SECRET in .env}
      GOTENBERG_URL: http://gotenberg:3000
      PUBLIC_BASE_URL: https://${DOMAIN}
      TZ: Asia/Shanghai
    volumes:
      - ${STORAGE_HOST_DIR:-../data/storage}:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: healthlog
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthlog"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  gotenberg:
    build: ./gotenberg
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
