root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/healthlog ./cmd/healthlog"
entrypoint = ["./tmp/healthlog", "serve"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "bin", "data", "web", "deploy", "docs"]
delay = 500
kill_delay = "2s"
send_interrupt = true

[misc]
clean_on_exit = true
